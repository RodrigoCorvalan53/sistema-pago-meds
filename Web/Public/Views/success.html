<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PagoMeds - Success</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {

          bluepm: "#219EBC",
          deepblue: "#023047",
          yellowpm: "#FFB703",

      }

    <div class="flex justify-center">
      <a href="/login" class="px-6 py-2 bg-orangepm text-white rounded-lg font-bold hover:bg-yellowpm transition">
        Volver
      </a>
    </div>

<script>
  const token = localStorage.getItem("token");

  if (!token) {
    window.location.href = "/login";
  }
</script>
